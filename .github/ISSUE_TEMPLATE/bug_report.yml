name: Bug
description: Un comportement incorrect dans l'indexeur, l'API ou le dashboard
labels: ["bug"]
body:
  - type: dropdown
    id: zone
    attributes:
      label: Zone concernée
      options:
        - backend (indexeur Ponder / API)
        - backend (contrats Solidity)
        - frontend (dashboard)
        - CI / déploiement
        - documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Comportement observé
      description: Que se passe-t-il ? Inclure le message d'erreur exact si possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      description: Route API appelée, action dans l'UI, commande lancée...
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Réseau (Sepolia/mainnet), adresse de token concernée, bloc, commit/version, navigateur si UI.
    validations:
      required: false
